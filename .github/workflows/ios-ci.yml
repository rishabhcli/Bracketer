name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve simulator destination
        id: destination
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          udid="$(
            xcrun simctl list devices available -j |
            ruby -rjson -e '
              devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
              pick = devices.find { |device|
                device["isAvailable"] && ["iPhone 17 Pro", "iPhone 17"].include?(device["name"])
              }
              abort("No available iPhone 17 Pro or iPhone 17 simulator found") unless pick
              print pick.fetch("udid")
            '
          )"
          echo "destination=platform=iOS Simulator,id=${udid}" >> "$GITHUB_OUTPUT"

      - name: Run unit and UI tests
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project Bracketer.xcodeproj \
            -scheme Bracketer \
            -destination "${{ steps.destination.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath build/Bracketer.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcresult bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bracketer-xcresult
          path: build/Bracketer.xcresult
          if-no-files-found: ignore
